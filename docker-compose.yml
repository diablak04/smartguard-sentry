# SmartGuard — orkiestracja uslug.
# n8n w kontenerze jest opcjonalne (automatyzacje); alert na Telegram idzie prosto z Pythona.
# Aplikacja (main.py) dziala na HOSCIE, bo potrzebuje kamery USB i portu COM (ESP32),
# a Docker na Windows nie daje do nich dostepu. Skan BLE robi ESP32, nie PC.

services:
  n8n:
    image: n8nio/n8n
    container_name: smartguard-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
